[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eaxy-tools"
version = "0.1.0"
description = "Convierte fotos en PDF y facturas (PDF o foto) en datos limpios con o sin IA. Hecho en Venezuela."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abixai Prin" }]
requires-python = ">=3.10"
dependencies = ["pillow>=10", "pypdf>=4"]
keywords = ["pdf", "facturas", "ocr", "ia", "openai", "gemini", "ollama", "venezuela", "rif", "iva"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "reportlab>=4", "httpx>=0.27"]

[project.scripts]
eaxy = "eaxy.cli:main"

[project.urls]
Repository = "https://github.com/abixaiprin/eaxy-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/eaxy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
